[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "electro-hobby-3d-updater"
version = "0.0.9"
description = "Thin dispatcher over JuanenRac's (Electro Hobby 3D) three real, independent ecosystem updaters (hydra-umc-updater, urtc-updater, armor-updater) - pick an ecosystem, download and update its packages. Holds no discovery or install logic of its own."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["hydra-umc", "urtc", "armor", "updater", "installer", "fleet-management"]
# Each of the three real sub-updaters (see ecosystems.py) is a real, public,
# pip-installable package already - depending on them here rather than
# re-vendoring or re-implementing their discovery/install logic is
# deliberate: this project has exactly one job, dispatch, and each
# ecosystem's own updater remains the one place its own logic can drift.
#
# Each one is pinned to a reviewed commit, never to a moving branch: a pip
# install must always install exactly what was reviewed, and a broken or
# compromised main of any sub-updater must not reach this tool by itself.
# To move to a newer release, review it, put its commit here, and bump this
# project's version (`electro-hobby-3d-updater versions` shows which ones
# are behind GitHub).
dependencies = [
    "hydra-umc-updater @ git+https://github.com/JuanenRac/HYDRA-UMC-UPDATER.git@ff0fb0ecdba51b24ca22d7d6ddae060d57ac854d",  # v0.4.7
    "urtc-updater @ git+https://github.com/JuanenRac/URTC-UPDATER.git@74f1d75a93768c262262955c23996129468a945d",  # v0.1.2
    "armor-updater @ git+https://github.com/JuanenRac/ARMOR-UPDATER.git@8dd40bdcb597332d590fe208dbf4826137912359",  # v0.1.4
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PySide6>=6.8,<7"]

[project.urls]
Homepage = "https://github.com/JuanenRac/ELECTRO-HOBBY-3D-UPDATER"

[project.scripts]
electro-hobby-3d-updater = "electro_hobby_3d_updater.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
electro_hobby_3d_updater = ["qml/*.qml", "assets/*"]
