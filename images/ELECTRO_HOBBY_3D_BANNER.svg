<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Electro Hobby 3D</title>
  <desc id="desc">Electro Hobby 3D - three independent engineering ecosystems: HYDRA-UMC, URTC and A.R.M.O.R.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090C"/>
      <stop offset="100%" stop-color="#12161C"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <g fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.2">
    <path d="M0 90H220L270 140H600"/>
    <path d="M1200 310H980L930 260H600"/>
    <path d="M0 320H180L230 270H520"/>
    <path d="M1200 70H1020L970 120H700"/>
  </g>

  <!-- Emblem: three linked nodes around a shared core, one per ecosystem -->
  <g transform="translate(200,200)" filter="url(#glow)" stroke="#00E5FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="26"/>
    <circle r="9" fill="#00E5FF" stroke="none"/>
    <g stroke="#FFB020" stroke-width="3">
      <path d="M0,-26 V-70"/>
      <path d="M-22,13 L-60,55"/>
      <path d="M22,13 L60,55"/>
    </g>
    <circle cy="-78" r="14"/>
    <circle cx="-68" cy="63" r="14"/>
    <circle cx="68" cy="63" r="14"/>
  </g>

  <text x="360" y="150" font-family="Arial, sans-serif" font-size="58" font-weight="bold" fill="#FFFFFF" letter-spacing="4">ELECTRO HOBBY 3D</text>
  <text x="364" y="190" font-family="Arial, sans-serif" font-size="18" fill="#00E5FF" letter-spacing="3">THREE INDEPENDENT ENGINEERING ECOSYSTEMS</text>

  <g font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    <rect x="362" y="230" width="150" height="40" rx="6" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <text x="437" y="256" fill="#FFFFFF" text-anchor="middle">HYDRA-UMC</text>
    <rect x="528" y="230" width="100" height="40" rx="6" fill="none" stroke="#FFB020" stroke-width="2"/>
    <text x="578" y="256" fill="#FFFFFF" text-anchor="middle">URTC</text>
    <rect x="644" y="230" width="150" height="40" rx="6" fill="none" stroke="#5DF0C4" stroke-width="2"/>
    <text x="719" y="256" fill="#FFFFFF" text-anchor="middle">A.R.M.O.R.</text>
  </g>

  <text x="364" y="300" font-family="Arial, sans-serif" font-size="15" fill="#8FA3B0">Robotics and industrial automation · a universal tool-changer subsystem · private perimeter security and home automation</text>
</svg>
