[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "electro-hobby-3d-updater"
version = "0.1.1"
description = "Thin dispatcher over JuanenRac's (Electro Hobby 3D) four real, independent ecosystem updaters (hydra-umc-updater, urtc-updater, armor-updater, eh3d-updater) - pick an ecosystem, download and update its packages. Holds no discovery or install logic of its own."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["hydra-umc", "urtc", "armor", "eh3d", "updater", "installer", "fleet-management"]
# Each of the four real sub-updaters (see ecosystems.py) is a real, public,
# pip-installable package already - depending on them here rather than
# re-vendoring or re-implementing their discovery/install logic is
# deliberate: this project has exactly one job, dispatch, and each
# ecosystem's own updater remains the one place its own logic can drift.
#
# Each one is pinned to a reviewed commit, never to a moving branch: a pip
# install must always install exactly what was reviewed, and a broken or
# compromised main of any sub-updater must not reach this tool by itself.
# To move to a newer release, review it, put its commit here, and bump this
# project's version (`electro-hobby-3d-updater versions` shows which ones
# are behind GitHub).
dependencies = [
    "hydra-umc-updater @ git+https://github.com/JuanenRac/HYDRA-UMC-UPDATER.git@08403a70510d3c5dabfbe871e5de4155f7d6574a",  # v0.4.8
    "urtc-updater @ git+https://github.com/JuanenRac/URTC-UPDATER.git@30c523a23f012af5d8b0e77cce058714428046ac",  # v0.1.7
    "armor-updater @ git+https://github.com/JuanenRac/ARMOR-UPDATER.git@22196a0684327a2e8ff094cf3502dd208f3efc31",  # v0.1.4
    "eh3d-updater @ git+https://github.com/JuanenRac/EH3D-UPDATER.git@c046105ead8000fd4efa4e3473b6278c4c77efcd",  # v0.0.1
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PySide6>=6.8,<7"]

[project.urls]
Homepage = "https://github.com/JuanenRac/ELECTRO-HOBBY-3D-UPDATER"

[project.scripts]
electro-hobby-3d-updater = "electro_hobby_3d_updater.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
electro_hobby_3d_updater = ["qml/*.qml", "assets/*"]
