name: ELECTRO-HOBBY-3D-UPDATER CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # the validation every repository of the suite shares, kept once in EH3D-DOCS; this validator is of an older
    # generation (it needs its own folder on the path, so not isolated) and runs on the Python of the test job
    uses: JuanenRac/EH3D-DOCS/.github/workflows/validate.yml@a265d9577af7594686400f387d24f36dabaa11a5
    with:
      python-version: "3.11"
      isolated: false
      check-pictures: false

  baseline:
    name: Install and run the real test suite
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Installs this project plus its four real dependencies - hydra-umc-
      # updater, urtc-updater, armor-updater and eh3d-updater - straight from GitHub, the
      # same four real packages a developer's own build.sh/.bat pulls in.
      - name: Install this project and its four real ecosystem updaters
        run: python -m pip install -e ".[dev]"

      - name: Compile every Python source and run the real test suite
        run: python tools/build_test.py
      - name: The change has a line in the CHANGELOG
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -I tools/changelog_pr_check.py --base "origin/$BASE_REF"

  python-versions:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest Python the package promises (requires-python)
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install this project and its four real ecosystem updaters
        run: python -m pip install -e ".[dev]"
      - name: Run the tests
        run: python -m pytest tests -q
      - name: The code still reads with the grammar of the oldest Python promised
        run: python -I -m unittest discover -s tools -p "test_python_minimum.py"

  pins:
    name: Pinned updaters against their latest tags (warning only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # only informs: a late pin is a warning in the log, and a repository that cannot be reached is skipped; this step never fails the run
      - name: Warn about a pin that is behind the latest tag of its repository
        continue-on-error: true
        run: python tools/check_pins.py

      # a run started by hand is the check before a release: there a pin that is behind fails
      - name: Fail on a pin that is behind the latest tag when the run is started by hand
        if: github.event_name == 'workflow_dispatch'
        run: python tools/check_pins.py --strict

  pictures:
    name: Pictures of the README
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the pictures are drawn with Python 3.12 or newer (the sum of floats changed in 3.12), so this job does not use the 3.11 of the test job
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: The Architecture and Repository Structure pictures match their data
        run: |
          python -I tools/make_architecture.py --check
          python -I tools/make_structure.py --check --readmes
